# Feste Regelauswahl, damit lokale Prueflaeufe und CI dasselbe sagen -
# unabhaengig von einer globalen Ruff-Konfiguration auf dem Entwicklerrechner.
# Gleiches Muster wie im FreizeitManager; die Auswahl unterscheidet sich nur
# dort, wo die Aufgabe es verlangt.
line-length = 110
target-version = "py311"

[lint]
# Echte Fehler plus toter Code und Importordnung.
#
# DTZ ist hier - anders als im FreizeitManager - ausdruecklich dabei: Der Host
# schreibt Events, Manifeste und Update-Ergebnisse, die andere Programme lesen.
# Eine naive Ortszeit in einer solchen Angabe ist ein Fehler, der erst beim
# Vergleich zweier Rechner auffaellt. Die einzige bewusste Ausnahme - lokale
# Zeit in Dateinamen - steht begruendet in lifeplanner_core/zeitmarke.py.
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM", "RUF100", "DTZ"]
ignore = [
    # SIM105 raet zu contextlib.suppress statt try/except/pass. Das ist hier
    # ausdruecklich unerwuenscht: Der Ausnahmen-Ratchet
    # (tools/exception_audit.py) zaehlt stumme Schlucker und deckelt sie.
    # Beide Schreibweisen sind gleich stumm - die Umschreibung wuerde nichts
    # bessern, aber den Bestand kleiner aussehen lassen. Der richtige Weg ist
    # defensive_log.uebersprungen(), nicht eine andere Verpackung desselben
    # Schweigens. Genau so lag im FreizeitManager ein stummer Schlucker, den
    # der Ratchet bis Loop 45 nicht sehen konnte.
    "SIM105",
    "E402",    # Importe nach sys.path-Anpassung sind in Werkzeugen noetig
]
