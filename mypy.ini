# Typprüfung des Hosts. Dieselbe Haltung wie im BudgetManager: nicht streng
# von Anfang an, sondern so streng, dass sie heute grün ist und morgen einen
# Rückschritt meldet.
[mypy]
python_version = 3.12
ignore_missing_imports = True
follow_imports = silent
check_untyped_defs = False
warn_unused_ignores = False
warn_return_any = False
no_strict_optional = True
allow_redefinition = True
pretty = True
show_error_codes = True
exclude = (?x)(^build/|^dist/|^\.venv/|^modules/|^__pycache__/)

[mypy-PySide6.*]
ignore_missing_imports = True

# Keine Ausnahme fuer requests: Die Stubs stehen in requirements-dev.txt
# (types-requests). Eine Ausnahme hier wuerde auch echte Fehler in diesem
# Bereich verschlucken.
