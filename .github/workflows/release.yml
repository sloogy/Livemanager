name: Release

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "lifeplanner-v*"

jobs:
  build-windows:
    if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')) || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      LIFEPLANNER_BUDGETMANAGER_SOURCE: ${{ github.workspace }}\module-sources\budgetmanager
      LIFEPLANNER_FPM_SOURCE: ${{ github.workspace }}\module-sources\fpm
      LIFEPLANNER_FREIZEITMANAGER_SOURCE: ${{ github.workspace }}\module-sources\freizeitmanager
    steps:
      - name: Checkout LifePlanner Core
        uses: actions/checkout@v4
        with:
          path: lifeplanner

      - name: Resolve release metadata
        shell: pwsh
        working-directory: lifeplanner
        run: |
          $version = (python -c "from lifeplanner_core import APP_VERSION; print(APP_VERSION)").Trim()
          "LIFEPLANNER_VERSION=$version" >> $env:GITHUB_ENV
          "LIFEPLANNER_RELEASE_TAG=lifeplanner-v$version" >> $env:GITHUB_ENV

      - name: Checkout BudgetManager repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.BUDGETMANAGER_REPOSITORY || 'sloogy/Budgetmanager' }}
          ref: ${{ vars.BUDGETMANAGER_REF || 'v2.2.63' }}
          token: ${{ secrets.LIFEPLANNER_MODULES_TOKEN || github.token }}
          path: module-sources/budgetmanager

      - name: Checkout FPM repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.FPM_REPOSITORY || 'sloogy/FPM' }}
          ref: ${{ vars.FPM_REF || 'v1.0.3' }}
          token: ${{ secrets.LIFEPLANNER_MODULES_TOKEN || github.token }}
          path: module-sources/fpm

      - name: Checkout Kontaktmanager repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.FREIZEITMANAGER_REPOSITORY || 'sloogy/Kontaktmanager' }}
          ref: ${{ vars.FREIZEITMANAGER_REF || 'v0.1.1' }}
          token: ${{ secrets.LIFEPLANNER_MODULES_TOKEN || github.token }}
          path: module-sources/freizeitmanager

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            lifeplanner/requirements-dev.txt
            module-sources/budgetmanager/requirements*.txt
            module-sources/fpm/requirements*.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r lifeplanner/requirements-dev.txt
          if (Test-Path "module-sources/budgetmanager/requirements.txt") { python -m pip install -r module-sources/budgetmanager/requirements.txt }
          if (Test-Path "module-sources/fpm/requirements.txt") { python -m pip install -r module-sources/fpm/requirements.txt }

      - name: Validate Core and separate module repositories
        working-directory: lifeplanner
        run: python tools/validate_release.py --with-modules

      - name: Build portable, module packages and installer source
        working-directory: lifeplanner
        env:
          LIFEPLANNER_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ env.LIFEPLANNER_RELEASE_TAG }}
          BUDGETMANAGER_REPOSITORY: ${{ vars.BUDGETMANAGER_REPOSITORY || 'sloogy/Budgetmanager' }}
          FPM_REPOSITORY: ${{ vars.FPM_REPOSITORY || 'sloogy/FPM' }}
          LIFEPLANNER_UPDATE_PRIVATE_KEY_B64: ${{ secrets.LIFEPLANNER_UPDATE_PRIVATE_KEY_B64 }}
          LIFEPLANNER_UPDATE_PUBLIC_KEY_B64: ${{ vars.LIFEPLANNER_UPDATE_PUBLIC_KEY_B64 }}
        run: >-
          python tools/build_release.py
          --budgetmanager-source "${{ env.LIFEPLANNER_BUDGETMANAGER_SOURCE }}"
          --fpm-source "${{ env.LIFEPLANNER_FPM_SOURCE }}"
          --freizeitmanager-source "${{ env.LIFEPLANNER_FREIZEITMANAGER_SOURCE }}"

      - name: Verify signed assets and provenance
        shell: pwsh
        working-directory: lifeplanner
        run: |
          # Der Erst-Release ging bewusst unsigniert heraus. Seither prueft der
          # Updater fail-closed - ein Release ohne Signatur waere fuer jede
          # installierte Fassung tot, darum kehrt sich der Gate um.
          if (-not (Test-Path "release/update-assets/lifeplanner-latest.json.sig")) { throw "lifeplanner-latest.json.sig fehlt - sind LIFEPLANNER_UPDATE_PRIVATE_KEY_B64 (Secret) und LIFEPLANNER_UPDATE_PUBLIC_KEY_B64 (Variable) gesetzt?" }
          if ((Get-ChildItem "release/update-assets/*.lpmodule" | Measure-Object).Count -lt 2) { throw "Module packages missing" }
          if (-not (Test-Path "release/module-source-provenance.json")) { throw "Module source provenance missing" }
          if (-not (Test-Path "release/LifePlannerInstallerBootstrap.exe")) { throw "Installer bootstrap missing" }
          if (-not (Test-Path "release/LifePlanner_Installer_Source/installer-module-sources.json")) { throw "Installer module sources missing" }
          if ((Get-ChildItem "release/LifePlanner_Installer_Source/modules" -Force | Measure-Object).Count -ne 0) { throw "Installer must not embed modules" }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        working-directory: lifeplanner
        shell: pwsh
        run: |
          iscc installer\LifePlanner.iss
          if (-not (Test-Path "release/LifePlanner_${env:LIFEPLANNER_VERSION}_Windows_Setup.exe")) { throw "Windows setup missing" }

      - name: Publish GitHub release assets
        if: github.event_name != 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        working-directory: lifeplanner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:LIFEPLANNER_RELEASE_TAG" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:LIFEPLANNER_RELEASE_TAG" --target "$env:GITHUB_SHA" --title "LifePlanner $env:LIFEPLANNER_VERSION" --generate-notes
            if ($LASTEXITCODE -ne 0) { gh release view "$env:LIFEPLANNER_RELEASE_TAG" *> $null }
          }
          gh release upload "$env:LIFEPLANNER_RELEASE_TAG" "release/LifePlanner_${env:LIFEPLANNER_VERSION}_Windows_Portable.zip" "release/LifePlanner_${env:LIFEPLANNER_VERSION}_Windows_Setup.exe" release/module-source-provenance.json release/update-assets/* --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: LifePlanner-Windows
          path: |
            lifeplanner/release/LifePlanner_*_Windows_Portable.zip
            lifeplanner/release/LifePlanner_*_Windows_Setup.exe
            lifeplanner/release/module-source-provenance.json
            lifeplanner/release/update-assets/*

  build-linux:
    if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      LIFEPLANNER_BUDGETMANAGER_SOURCE: ${{ github.workspace }}/module-sources/budgetmanager
      LIFEPLANNER_FPM_SOURCE: ${{ github.workspace }}/module-sources/fpm
      LIFEPLANNER_FREIZEITMANAGER_SOURCE: ${{ github.workspace }}/module-sources/freizeitmanager
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout LifePlanner Core
        uses: actions/checkout@v4
        with:
          path: lifeplanner

      - name: Resolve release metadata
        working-directory: lifeplanner
        run: |
          version="$(python -c 'from lifeplanner_core import APP_VERSION; print(APP_VERSION)')"
          echo "LIFEPLANNER_VERSION=$version" >> "$GITHUB_ENV"
          echo "LIFEPLANNER_RELEASE_TAG=lifeplanner-v$version" >> "$GITHUB_ENV"

      - name: Checkout BudgetManager repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.BUDGETMANAGER_REPOSITORY || 'sloogy/Budgetmanager' }}
          ref: ${{ vars.BUDGETMANAGER_REF || 'v2.2.63' }}
          token: ${{ secrets.LIFEPLANNER_MODULES_TOKEN || github.token }}
          path: module-sources/budgetmanager

      - name: Checkout FPM repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.FPM_REPOSITORY || 'sloogy/FPM' }}
          ref: ${{ vars.FPM_REF || 'v1.0.3' }}
          token: ${{ secrets.LIFEPLANNER_MODULES_TOKEN || github.token }}
          path: module-sources/fpm

      - name: Checkout Kontaktmanager repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.FREIZEITMANAGER_REPOSITORY || 'sloogy/Kontaktmanager' }}
          ref: ${{ vars.FREIZEITMANAGER_REF || 'v0.1.1' }}
          token: ${{ secrets.LIFEPLANNER_MODULES_TOKEN || github.token }}
          path: module-sources/freizeitmanager

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            lifeplanner/requirements-dev.txt
            module-sources/budgetmanager/requirements*.txt
            module-sources/fpm/requirements*.txt

      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 libfontconfig1

      - name: Install dependencies
        run: |
          python -m pip install -r lifeplanner/requirements-dev.txt
          test ! -f module-sources/budgetmanager/requirements.txt || python -m pip install -r module-sources/budgetmanager/requirements.txt
          test ! -f module-sources/fpm/requirements.txt || python -m pip install -r module-sources/fpm/requirements.txt

      - name: Validate Core and module repositories
        working-directory: lifeplanner
        run: python tools/validate_release.py --with-modules

      - name: Build signed portable and updater assets
        working-directory: lifeplanner
        env:
          LIFEPLANNER_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ env.LIFEPLANNER_RELEASE_TAG }}
          LIFEPLANNER_UPDATE_PRIVATE_KEY_B64: ${{ secrets.LIFEPLANNER_UPDATE_PRIVATE_KEY_B64 }}
          LIFEPLANNER_UPDATE_PUBLIC_KEY_B64: ${{ vars.LIFEPLANNER_UPDATE_PUBLIC_KEY_B64 }}
        run: >-
          python tools/build_linux_release.py
          --budgetmanager-source "${{ env.LIFEPLANNER_BUDGETMANAGER_SOURCE }}"
          --fpm-source "${{ env.LIFEPLANNER_FPM_SOURCE }}"
          --freizeitmanager-source "${{ env.LIFEPLANNER_FREIZEITMANAGER_SOURCE }}"

      - name: Verify Linux artifacts
        working-directory: lifeplanner
        run: |
          test -f "release-linux/LifePlanner_${LIFEPLANNER_VERSION}_Linux_x86_64_Portable.tar.gz"
          test -f "release-linux/LifePlanner_${LIFEPLANNER_VERSION}_Linux_x86_64_Portable.zip"
          test -f release-linux/update-assets/lifeplanner-latest-linux.json.sig
          test "$(find release-linux/update-assets -maxdepth 1 -name '*.lpmodule' -type f | wc -l)" -ge 2
          test -f release-linux/module-source-provenance-linux.json

      - name: Publish GitHub release assets
        if: github.event_name != 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        working-directory: lifeplanner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$LIFEPLANNER_RELEASE_TAG" >/dev/null 2>&1 || gh release create "$LIFEPLANNER_RELEASE_TAG" --target "$GITHUB_SHA" --title "LifePlanner $LIFEPLANNER_VERSION" --generate-notes || gh release view "$LIFEPLANNER_RELEASE_TAG" >/dev/null 2>&1
          gh release upload "$LIFEPLANNER_RELEASE_TAG" "release-linux/LifePlanner_${LIFEPLANNER_VERSION}_Linux_x86_64_Portable.tar.gz" "release-linux/LifePlanner_${LIFEPLANNER_VERSION}_Linux_x86_64_Portable.zip" release-linux/module-source-provenance-linux.json release-linux/update-assets/* --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: LifePlanner-Linux
          path: |
            lifeplanner/release-linux/LifePlanner_*_Linux_x86_64_Portable.tar.gz
            lifeplanner/release-linux/LifePlanner_*_Linux_x86_64_Portable.zip
            lifeplanner/release-linux/module-source-provenance-linux.json
            lifeplanner/release-linux/update-assets/*
