name: Prepare Suite Release

on:
  push:
    branches:
      - 'release-trigger/lifeplanner-v*'

permissions:
  contents: write
  actions: write

concurrency:
  group: lifeplanner-release-prepare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: "!startsWith(github.event.head_commit.message, '[release-status]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Hostversion und geprüfte Modulstände setzen
        shell: bash
        run: |
          set -euo pipefail
          REQUEST="${GITHUB_REF_NAME#release-trigger/lifeplanner-v}"
          VERSION="${REQUEST%%-r*}"
          TAG="lifeplanner-v${VERSION}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$REQUEST" != "$VERSION" && ! "$REQUEST" =~ ^${VERSION}-r[1-9][0-9]*$ ]]; then
            echo "Ungültiger Retry-Suffix: ${REQUEST}" >&2
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          python - "$VERSION" <<'PY'
          import json, re, sys
          from pathlib import Path

          version = sys.argv[1]
          core = Path('lifeplanner_core/__init__.py')
          source = core.read_text(encoding='utf-8')
          source, count = re.subn(
              r'^APP_VERSION\s*=\s*"[^"]+"',
              f'APP_VERSION = "{version}"',
              source,
              count=1,
              flags=re.M,
          )
          if count != 1:
              raise SystemExit('APP_VERSION nicht eindeutig gefunden')
          core.write_text(source, encoding='utf-8')

          lock_path = Path('dependencies/modules.lock.json')
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          wanted = {
              'budgetmanager': ('2.2.72', 'v2.2.72'),
              'fpm': ('1.2.3', 'v1.2.3'),
              'freizeitmanager': ('0.1.12', 'v0.1.12'),
          }
          for module in lock['modules']:
              if module['id'] in wanted:
                  module['version'], module['default_ref'] = wanted[module['id']]
          lock_path.write_text(
              json.dumps(lock, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )

          workflow = Path('.github/workflows/release.yml')
          text = workflow.read_text(encoding='utf-8')
          replacements = (
              (
                  r"(repository:\s*\$\{\{ vars\.BUDGETMANAGER_REPOSITORY[^\n]*\}\}\s*\n\s*ref:)\s*[^\n]+",
                  r"\1 'v2.2.72'",
              ),
              (
                  r"(repository:\s*\$\{\{ vars\.FPM_REPOSITORY[^\n]*\}\}\s*\n\s*ref:)\s*[^\n]+",
                  r"\1 'v1.2.3'",
              ),
              (
                  r"(repository:\s*\$\{\{ vars\.FREIZEITMANAGER_REPOSITORY[^\n]*\}\}\s*\n\s*ref:)\s*[^\n]+",
                  r"\1 'v0.1.12'",
              ),
          )
          for pattern, replacement in replacements:
              text, count = re.subn(pattern, replacement, text)
              if count < 2:
                  raise SystemExit(
                      f'Release-Ref nicht in Windows+Linux gefunden: {pattern} ({count})'
                  )
          workflow.write_text(text, encoding='utf-8')
          PY
          python tools/sync_version.py
          python tools/sync_version.py --check

      - name: Modul-Tags und grüne Full-Releases müssen existieren
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            'sloogy/Budgetmanager:v2.2.72' \
            'sloogy/FPM:v1.2.3' \
            'sloogy/Kontaktmanager:v0.1.12'
          do
            repo="${spec%%:*}"
            ref="${spec#*:}"
            gh api "repos/${repo}/git/ref/tags/${ref}" >/dev/null
          done

          gh api 'repos/sloogy/Budgetmanager/contents/.release-status/v2.2.72.ok?ref=release-trigger/v2.2.72-r4' \
            --jq '.content' | base64 -d | grep -Fx 'status=success'
          gh api 'repos/sloogy/FPM/contents/.release-status/v1.2.3.ok?ref=release-trigger/v1.2.3' \
            --jq '.content' | base64 -d | grep -Fx 'status=success'
          gh api 'repos/sloogy/Kontaktmanager/contents/.release-status/v0.1.12.ok?ref=release-trigger/v0.1.12' \
            --jq '.content' | base64 -d | grep -Fx 'status=success'

      - name: Release-Validierung ohne Modulbuild
        run: python tools/validate_release.py

      - name: Synchronisierten Release-Commit erzeugen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .release-trigger
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "[release] LifePlanner v${VERSION}"
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Main fast-forwarden und Tag unveränderlich setzen
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "Release-Branch ist kein Fast-Forward von main; Abbruch." >&2
            exit 1
          fi
          git push origin HEAD:main

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
            test "$REMOTE_SHA" = "$(git rev-parse HEAD)" || {
              echo "Tag ${TAG} existiert bereits auf anderem Commit; kein Force-Move." >&2
              exit 1
            }
          else
            git tag "$TAG" HEAD
            git push origin "$TAG"
          fi

      - name: Bestehenden Full-Release starten und Erfolg verlangen
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD)"
          gh workflow run release.yml --ref "$TAG"
          RUN_ID=""
          for _ in $(seq 1 45); do
            RUN_ID="$(gh run list --workflow release.yml --event workflow_dispatch --limit 30 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"${TARGET_SHA}\") | .databaseId" | head -n1)"
            [ -n "$RUN_ID" ] && break
            sleep 2
          done
          test -n "$RUN_ID" || { echo "Release-Run nicht gefunden" >&2; exit 1; }
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "Release workflow run: $RUN_ID"
          gh run watch "$RUN_ID" --exit-status

      - name: Grünen Full-Release auf dem Triggerbranch markieren
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release-status
          printf 'tag=%s\ncommit=%s\nworkflow_run=%s\nstatus=success\n' \
            "$TAG" "$(git rev-parse HEAD)" "$RUN_ID" > ".release-status/${TAG}.ok"
          git add ".release-status/${TAG}.ok"
          git commit -m "[release-status] ${TAG} full release passed"
          git push origin "HEAD:${GITHUB_REF_NAME}"
