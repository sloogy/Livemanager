name: Prepare Suite Release

on:
  push:
    branches:
      - 'release-trigger/lifeplanner-v*'

permissions:
  contents: write
  actions: write

concurrency:
  group: lifeplanner-release-prepare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: "!startsWith(github.event.head_commit.message, '[release-status]')"
    runs-on: ubuntu-latest

    # Jobweit: Die Release-Validierung faehrt pytest, und PySide6 braucht ohne
    # Anzeige die Offscreen-Plattform. push-checks.yml setzt das laengst.
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Ohne diesen Schritt lief der Job komplett ohne Abhaengigkeiten. Das
      # fiel erst bei "Release-Validierung ohne Modulbuild" auf, und zwar als
      # ModuleNotFoundError fuer requests aus lifeplanner_core/updater/io.py -
      # eine Meldung, die nach kaputtem Code aussieht statt nach einem
      # Workflow, der nie etwas installiert hat.
      # PySide6 laedt libEGL beim Import. Ohne diese Pakete brach pytest schon
      # beim Einsammeln ab (ImportError: libEGL.so.1), was nach einem kaputten
      # Test aussieht statt nach einem Runner ohne Qt-Systembibliotheken.
      # push-checks.yml installiert sie laengst; dieser Job nie.
      - name: Qt-Systembibliotheken installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Hostversion und geprüfte Modulstände setzen
        shell: bash
        run: |
          set -euo pipefail
          REQUEST="${GITHUB_REF_NAME#release-trigger/lifeplanner-v}"
          VERSION="${REQUEST%%-r*}"
          TAG="lifeplanner-v${VERSION}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$REQUEST" != "$VERSION" && ! "$REQUEST" =~ ^${VERSION}-r[1-9][0-9]*$ ]]; then
            echo "Ungültiger Retry-Suffix: ${REQUEST}" >&2
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          python - "$VERSION" <<'PY'
          import re, sys
          from pathlib import Path

          version = sys.argv[1]
          core = Path('lifeplanner_core/__init__.py')
          source = core.read_text(encoding='utf-8')
          source, count = re.subn(
              r'^APP_VERSION\s*=\s*"[^"]+"',
              f'APP_VERSION = "{version}"',
              source,
              count=1,
              flags=re.M,
          )
          if count != 1:
              raise SystemExit('APP_VERSION nicht eindeutig gefunden')
          core.write_text(source, encoding='utf-8')

          # Die Lockdatei bleibt unangetastet: Sie ist die Quelle, und
          # release.yml liest die Refs zur Laufzeit ueber die LOCK_*-Variablen
          # aus tools/module_sources.py.
          #
          # Hier stand bis hierher eine feste Liste - budgetmanager 2.2.72,
          # fpm 1.2.3, freizeitmanager 0.1.12 - die die Lockdatei bei jedem
          # Release ueberschrieb. Ein Modulstand, den jemand in der Lockdatei
          # hob, war nach dem naechsten Release wieder auf 2.2.72 zurueck.
          # Danach ersetzte der Block feste ref:-Zeilen in release.yml, die es
          # dort seit test_module_sources.py::
          # test_release_workflow_carries_no_versions gar nicht mehr gibt: Der
          # Lauf brach mit "Release-Ref nicht in Windows+Linux gefunden" ab.
          # Beides zusammen hiess, dass der Host sich nicht releasen liess.
          PY
          python tools/sync_version.py
          python tools/sync_version.py --check

      - name: Modul-Tags und veröffentlichte Releases müssen existieren
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Die Modulliste kommt aus der Lockdatei, nicht aus einer zweiten
          # festen Liste. Hier standen v2.2.72, v1.2.3 und v0.1.12 samt der
          # Triggerbranches, auf denen ihre .release-status-Datei lag. Die
          # Liste veraltete unabhaengig von der Lockdatei, und Triggerbranches
          # werden aufgeraeumt - die Pruefung haette einen gepflegten
          # Modulstand abgelehnt, weil ein Branch von damals fehlt.
          #
          # Geprueft wird jetzt, was zaehlt und bleibt: Traegt das Modul den
          # Tag, und haengt daran ein veroeffentlichtes Release mit Assets?
          # Ein Release ohne Assets ist fuer den Host wertlos - er laedt
          # genau die .lpmodule-Pakete.
          python - <<'PY' > "${RUNNER_TEMP}/module_specs.txt"
          import json
          from pathlib import Path

          lock = json.loads(
              Path('dependencies/modules.lock.json').read_text(encoding='utf-8')
          )
          for module in lock['modules']:
              print(module['default_repository'], module['default_ref'])
          PY

          while read -r repo ref; do
            [ -n "$repo" ] || continue
            echo "Pruefe ${repo} ${ref}"
            gh api "repos/${repo}/git/ref/tags/${ref}" >/dev/null
            anzahl="$(gh release view "$ref" --repo "$repo" --json assets --jq '.assets | length')"
            if [ "$anzahl" -lt 1 ]; then
              echo "Release ${repo} ${ref} hat keine Assets" >&2
              exit 1
            fi
            echo "  Tag und Release vorhanden, ${anzahl} Assets"
          done < "${RUNNER_TEMP}/module_specs.txt"

      - name: Release-Validierung ohne Modulbuild
        run: python tools/validate_release.py

      - name: Synchronisierten Release-Commit erzeugen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .release-trigger
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "[release] LifePlanner v${VERSION}"
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Main fast-forwarden und Tag unveränderlich setzen
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "Release-Branch ist kein Fast-Forward von main; Abbruch." >&2
            exit 1
          fi
          git push origin HEAD:main

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
            test "$REMOTE_SHA" = "$(git rev-parse HEAD)" || {
              echo "Tag ${TAG} existiert bereits auf anderem Commit; kein Force-Move." >&2
              exit 1
            }
          else
            git tag "$TAG" HEAD
            git push origin "$TAG"
          fi

      - name: Bestehenden Full-Release starten und Erfolg verlangen
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD)"
          gh workflow run release.yml --ref "$TAG"
          RUN_ID=""
          for _ in $(seq 1 45); do
            RUN_ID="$(gh run list --workflow release.yml --event workflow_dispatch --limit 30 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"${TARGET_SHA}\") | .databaseId" | head -n1)"
            [ -n "$RUN_ID" ] && break
            sleep 2
          done
          test -n "$RUN_ID" || { echo "Release-Run nicht gefunden" >&2; exit 1; }
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "Release workflow run: $RUN_ID"
          gh run watch "$RUN_ID" --exit-status

      - name: Grünen Full-Release auf dem Triggerbranch markieren
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release-status
          printf 'tag=%s\ncommit=%s\nworkflow_run=%s\nstatus=success\n' \
            "$TAG" "$(git rev-parse HEAD)" "$RUN_ID" > ".release-status/${TAG}.ok"
          git add ".release-status/${TAG}.ok"
          git commit -m "[release-status] ${TAG} full release passed"
          git push origin "HEAD:${GITHUB_REF_NAME}"
